[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadflow-bridge-demo"
version = "2.0.0"
description = "Reproducible portfolio demo: CSV lead import into an authenticated REST CRM API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Peter Schuller"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
visual = ["cairosvg>=2.7,<3", "pillow>=10,<13", "playwright>=1.40,<2"]

[project.scripts]
leadflow = "leadflow_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"leadflow_bridge" = ["static/*.html"]
